[tls]
  [[tls.certificates]]
    certFile = "/certs/odontoapi-chain.crt"
    keyFile  = "/certs/odontoapi.key"

[http.middlewares]

  [http.middlewares.secure-headers.headers]
    sslRedirect = true
    stsSeconds = 63072000
    stsIncludeSubdomains = true
    stsPreload = true
    forceSTSHeader = true
    frameDeny = true
    contentTypeNosniff = true
    browserXssFilter = true
    referrerPolicy = "strict-origin-when-cross-origin"

[http.middlewares.redirect-to-https.redirectScheme]
  scheme = "https"
  permanent = true

[http.routers.http-catchall]
  rule = "HostRegexp(`{any:.+}`)"
  entryPoints = ["web"]
  middlewares = ["redirect-to-https"]
  service = "noop"
  priority = 1

[http.services.noop.loadBalancer]
  [[http.services.noop.loadBalancer.servers]]
    url = "http://0.0.0.0"
