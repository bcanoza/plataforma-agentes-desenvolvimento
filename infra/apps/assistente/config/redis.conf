# Configuração Redis para Assistente

# Persistência
save 900 1
save 300 10
save 60 10000

# Segurança básica
protected-mode yes
port 6379

# Memória
maxmemory 512mb
maxmemory-policy allkeys-lru

# Logs
loglevel notice
logfile ""

# Network
bind 0.0.0.0
tcp-keepalive 300

# Timeout
timeout 0

# Configurações para Celery
databases 16

# Performance
tcp-backlog 511