# Configuração Redis para Assistente

# === PERSISTÊNCIA ===
save 900 1
save 300 10 
save 60 10000

# === SEGURANÇA ===
protected-mode yes
port 6379
bind 0.0.0.0

# === MEMÓRIA ===
maxmemory 512mb
maxmemory-policy allkeys-lru

# === LOGS ===
loglevel notice
logfile ""

# === PERFORMANCE ===
tcp-keepalive 300
timeout 0
tcp-backlog 511

# === CELERY ===
databases 16

# === NETWORK ===
# Permite conexões externas (para Docker)