version: '3.8'

services:
  # Base de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: assistente_postgres
    restart: always
    environment:
      POSTGRES_DB: assistente
      POSTGRES_USER: app_writer
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      TZ: America/Sao_Paulo
    volumes:
      - assistente_postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - assistente_network
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_writer -d assistente"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis para Celery broker e cache
  redis:
    image: redis:7-alpine
    container_name: assistente_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - assistente_redis_data:/data
      - ./config/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - assistente_network
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API REST principal
  api:
    build: 
      context: ../../../app
      dockerfile: Dockerfile
    container_name: assistente_api
    restart: always
    ports:
      - "7000:7000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=assistente
      - DB_USER=app_writer
      - DB_PASS=${DB_PASS:-password}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=America/Sao_Paulo
      - INTERNAL_API_BASE=http://api:7000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - APP_SECRET=${APP_SECRET:-changeme}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - assistente_network
      - web  # Para Traefik
    volumes:
      - ../../../app:/app
      - assistente_api_logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 7000 --reload
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assistente-api.rule=Host(`api.odontoapi.com`)"
      - "traefik.http.routers.assistente-api.tls=true"
      - "traefik.http.services.assistente-api.loadbalancer.server.port=7000"
      - "traefik.docker.network=web"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker para processar tarefas
  worker:
    build: 
      context: ../../../app
      dockerfile: Dockerfile
    container_name: assistente_worker
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=assistente
      - DB_USER=app_writer
      - DB_PASS=${DB_PASS:-password}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=America/Sao_Paulo
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - assistente_network
    volumes:
      - ../../../app:/app
      - assistente_worker_logs:/app/logs
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Beat para agendamento de tarefas
  beat:
    build: 
      context: ../../../app
      dockerfile: Dockerfile
    container_name: assistente_beat
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=assistente
      - DB_USER=app_writer
      - DB_PASS=${DB_PASS:-password}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - assistente_network
    volumes:
      - ../../../app:/app
      - assistente_beat_logs:/app/logs
      - assistente_beat_schedule:/app/celerybeat-schedule
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/celerybeat-schedule/celerybeat-schedule
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Flower para monitoramento do Celery
  flower:
    build: 
      context: ../../../app
      dockerfile: Dockerfile
    container_name: assistente_flower
    restart: always
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=America/Sao_Paulo
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - assistente_network
      - web  # Para Traefik
    command: celery -A app.core.celery_app flower --port=5555 --broker=redis://redis:6379/0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assistente-flower.rule=Host(`flower.odontoapi.com`)"
      - "traefik.http.routers.assistente-flower.tls=true"
      - "traefik.http.services.assistente-flower.loadbalancer.server.port=5555"
      - "traefik.docker.network=web"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assistente_postgres_data:
  assistente_redis_data:
  assistente_api_logs:
  assistente_worker_logs:
  assistente_beat_logs:
  assistente_beat_schedule:

networks:
  assistente_network:
    driver: bridge
    name: assistente_network
  web:
    external: true