version: '3.8'

services:
  # Servidor de Email (Postfix + Dovecot)
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.odontoapi.com
    restart: always
    ports:
      - "25:25"    # SMTP
      - "587:587"  # SMTP with STARTTLS
      - "993:993"  # IMAPS
    volumes:
      - mailserver_data:/var/mail
      - mailserver_state:/var/mail-state
      - mailserver_logs:/var/log/mail
      - mailserver_config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
      - ./config/postfix-main.cf:/tmp/docker-mailserver/postfix-main.cf:ro
      - ./certs:/etc/letsencrypt:ro
    environment:
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
      - SSL_TYPE=letsencrypt
      - PERMIT_DOCKER=network
      - DMS_DEBUG=0
      - TZ=America/Sao_Paulo
    networks:
      - email_network
      - web  # Para Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`mail.odontoapi.com`)"
      - "traefik.http.routers.webmail.tls=true"
      - "traefik.http.services.webmail.loadbalancer.server.port=80"
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Interface web para email (opcional)
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: always
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=roundcube_db
      - ROUNDCUBEMAIL_DB_PORT=5432
      - ROUNDCUBEMAIL_DB_NAME=roundcube
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=${ROUNDCUBE_DB_PASS:-roundcube_pass}
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail.odontoapi.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.odontoapi.com
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - TZ=America/Sao_Paulo
    depends_on:
      - roundcube_db
      - mailserver
    networks:
      - email_network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.roundcube.rule=Host(`webmail.odontoapi.com`)"
      - "traefik.http.routers.roundcube.tls=true"
      - "traefik.http.services.roundcube.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Banco para interface web do email
  roundcube_db:
    image: postgres:15-alpine
    container_name: roundcube_postgres
    restart: always
    environment:
      POSTGRES_DB: roundcube
      POSTGRES_USER: roundcube
      POSTGRES_PASSWORD: ${ROUNDCUBE_DB_PASS:-roundcube_pass}
      TZ: America/Sao_Paulo
    volumes:
      - roundcube_db_data:/var/lib/postgresql/data
    networks:
      - email_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mailserver_data:
  mailserver_state:
  mailserver_logs:
  mailserver_config:
  roundcube_db_data:

networks:
  email_network:
    driver: bridge
    name: email_network
  web:
    external: true